<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>FitStack</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0A0A0F; color: #F2F2F5;
           font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
    .dot { width: 64px; height: 64px; border-radius: 50%; background: #FF6B2C; margin: 0 auto 20px; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { color: #A0A0AE; margin: 0 0 24px; max-width: 320px; }
    button { height: 48px; padding: 0 24px; border: 0; border-radius: 999px; background: #FF6B2C; color: #000; font-weight: 800; font-size: 15px; }
  </style>
</head>
<body>
  <!-- Shown only when the app can't reach FitStack (no connection, or no server URL configured). -->
  <main>
    <div class="dot" aria-hidden="true"></div>
    <h1>Can't reach FitStack</h1>
    <p>Check your internet connection and try again. Runs you recorded are saved on this phone and upload when you're back online.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
